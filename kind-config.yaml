# kind cluster for the whole assessment: 1 control-plane + 2 workers.
# The control-plane maps host ports 80/443 so ingress-nginx is reachable at
# http://ledger.local (add `127.0.0.1 ledger.local` to /etc/hosts).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dodo
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
