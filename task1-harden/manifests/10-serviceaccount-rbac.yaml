# Dedicated least-privilege ServiceAccount for ledger-api (drops the default SA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  namespace: payments
# The app does not talk to the Kubernetes API, so its token is not mounted.
automountServiceAccountToken: false
---
# Least-privilege Role: the workload only needs to read its own non-secret config.
# It is deliberately NOT granted access to Secrets, other pods, or any write verb.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-api-config-reader
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ledger-api-config"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-api-config-reader
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ledger-api-config-reader
subjects:
  - kind: ServiceAccount
    name: ledger-api
    namespace: payments
