apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api-config
  namespace: payments
  labels:
    app: ledger-api
data:
  # Non-secret application configuration only. Secrets live in the SOPS-encrypted
  # Secret (see ../secrets/), never here.
  LOG_LEVEL: "info"
  # SSRF allow-list consumed by /fetch in the hardened app.
  FETCH_ALLOWED_HOSTS: "api.dodopayments.example,status.dodopayments.example"
